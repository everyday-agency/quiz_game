name: Validate PHP and Laravel Beta release

on:
  pull_request:
  push:
    branches: ['remediation/**']
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: gd, dom, xml, xmlwriter, fileinfo, iconv, tokenizer, pdo_sqlite, ctype, mbstring, openssl, intl, bcmath, zip, sodium
      - name: Install the locked local Laravel validation harness
        run: composer install --working-dir=laravel-specialist/validation/harness --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Check archive, identities, grading, PHP and framework contracts
        run: node tests.mjs
      - name: Prepare static artifact
        run: node tools/build-site.mjs
      - name: Check static release contents
        run: node tests/release-artifact.mjs
      - name: Execute each PHP expansion batch in the selected isolated runtime
        run: |
          for batch in 1 2 3 4 5 6; do
            BATCH="$batch" node tests/php-expansion/runtime.mjs
          done
      - name: Validate all Laravel batches in the selected isolated runtime
        run: |
          export PHP_BINARIES="$(command -v php)"
          export REQUIRED_PHP_VERSIONS="${{ matrix.php }}"
          for batch in 1 2 3 4 5 6; do
            BATCH="$batch" node tests/laravel-specialist/runtime.mjs
            BATCH="$batch" node tools/laravel-specialist-check.mjs
          done
          node tests/laravel-specialist/focused-technical.mjs
          node tests/laravel-specialist/focused-editorial.mjs
          node tests/laravel-specialist/integration.mjs
          node tests/laravel-specialist/acceptance.mjs
      - name: Exercise Laravel Beta and subject switching in Chrome
        if: matrix.php == '8.5'
        run: node tests/laravel-specialist/browser.mjs
        env:
          QUIZ_SITE_DIR: _site
          BROWSER_REPORT_DIR: release/laravel-beta/evidence/browser-laravel
      - name: Exercise real Chrome against the prepared artifact
        if: matrix.php == '8.5'
        run: node tests/browser.mjs
        env:
          QUIZ_SITE_DIR: _site
          BROWSER_REPORT_DIR: php-pilot/regression
      - name: Exercise the 20 retained pilot questions in the default PHP collection
        if: matrix.php == '8.5'
        run: node tests/php-pilot/browser.mjs
        env:
          QUIZ_SITE_DIR: _site
      - name: Exercise PHP code viewer, copying and responsive scrolling in Chrome
        if: matrix.php == '8.5'
        run: node tests/code-viewer/browser.mjs
        env:
          QUIZ_SITE_DIR: _site
      - name: Exercise all 620 default PHP questions in Chrome
        if: matrix.php == '8.5'
        run: node tests/php-expansion/browser.mjs
        env:
          QUIZ_SITE_DIR: _site
      - name: Preserve failed mobile scroll diagnostics
        if: failure() && matrix.php == '8.5'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-scroll-diagnostics
          path: php-pilot/browser-mobile-scroll-failure.png
          if-no-files-found: ignore
